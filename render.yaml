services:
  - type: web
    name: streamx-api
    env: docker
    plan: free
    autoDeploy: true

    dockerfilePath: ./Dockerfile

    healthCheckPath: /health

    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: StreamX
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: SECRET_KEY
        sync: false
